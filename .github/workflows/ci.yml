name: CI

on:
  workflow_dispatch:
    inputs:
      full:
        description: "运行完整检查（含 Playwright 端到端测试）"
        required: false
        default: "true"
        type: boolean
      ref:
        description: "要检测的分支 / tag / commit"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify repository contract
        run: corepack pnpm verify:repo

      - name: Check formatting and lint
        run: corepack pnpm quality

      - name: Run checks
        run: corepack pnpm check

      - name: Run end-to-end tests
        if: ${{ inputs.full }}
        run: corepack pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
