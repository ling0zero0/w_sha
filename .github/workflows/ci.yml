name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "运行完整检查（含 Playwright 端到端测试）"
        required: false
        default: "true"
        type: boolean
      ref:
        description: "要检测的分支 / tag / commit"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify repository contract
        run: corepack pnpm verify:repo

      - name: Check formatting and lint
        run: corepack pnpm quality

      - name: Run checks
        run: corepack pnpm check

      - name: Install browser engines
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
        run: corepack pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
        run: corepack pnpm test:e2e:cross

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          if-no-files-found: ignore
